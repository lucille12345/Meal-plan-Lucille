<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf6ef">
<title>Weekly Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>Weekly <span class="accent">Meal</span> Planner</h1>
    <p>A week of meals made for you — with recipes, prices and one shopping list.</p>
  </header>
  <div class="steps">
    <div class="step" data-step="profile">1 · Your profile</div>
    <div class="step" data-step="review">2 · Your week</div>
    <div class="step" data-step="shopping">3 · Shopping list</div>
  </div>
  <div id="app"></div>
</div>

<script src="app.js"></script>
</body>
</html>
